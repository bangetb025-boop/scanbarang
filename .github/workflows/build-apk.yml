name: Build ScanBelanja APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Project
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Android module ==="
          ls -la android-app

      - name: Build Release APK
        run: gradle :android-app:assembleRelease

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanBelanja-APK
          path: |
            android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
