name: Build ScanBelanja APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== SDK Platforms ==="
          ls -la "$ANDROID_HOME/platforms" || true
          echo "=== Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :android:app:assembleRelease

      - name: Find APK
        run: |
          echo "=== Searching for APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanBelanja-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
